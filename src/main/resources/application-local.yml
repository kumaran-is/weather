spring:
# ======================================================================== 
# R2DBC Database Configuration uses H2 in-memory database  only for local
# ========================================================================    
  r2dbc:
    url: r2dbc:h2:file:///./target/h2db/weatherdb?options=AUTO_SERVER=TRUE;AUTO_SERVER_PORT=9092;DB_CLOSE_DELAY=-1
    username: sa
    password:
    # Add pool configuration for local profile
    pool:
      enabled: true
      initial-size: 3                    # Start with single connection for local dev
      max-size: 5                        # Smaller pool for local development  
      max-idle-time: 10m                  # Shorter idle time for local
      max-life-time: 30m                 # Shorter connection lifetime
      max-acquire-time: 2s              # Longer timeout for connection acquisition
      max-create-connection-time: 3s    # Longer timeout for new connection creation
      validation-query: SELECT 1         # H2 validation query
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
logging:
  file:
    name: ./logs/weather-service-local.log
  level:
    com.weather: DEBUG
    org.springframework.r2dbc: DEBUG
    io.r2dbc.h2: DEBUG
    org.springframework.boot.web: INFO
    org.springframework.boot.actuate: INFO
    org.springframework.boot.autoconfigure: WARN
    org.springframework.boot.context.config: WARN
    org.springframework.context: WARN
   
# ======================================================================== 
# Local profile specific resilience configuration
# ======================================================================== 
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 60.0
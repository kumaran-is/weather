# ==================================================================================
# Production Server & Netty Configuration
# ==================================================================================
server:
  netty:
    # Production-optimized Netty settings for high throughput
    connection-timeout: 5s                    # Longer timeout for production networks
    idle-timeout: 300s                       # 5 minutes idle timeout
    max-initial-line-length: 8192            # 8KB for larger production requests
    h2c-max-content-length: 8388608          # 8MB max content length
    validate-headers: true                   # Always validate in production

# ==================================================================================
# Production Environment Netty Configuration
# Industry Standard: High-performance production workloads
# Target: 1000+ concurrent users, maximum throughput and reliability
# ==================================================================================

# JVM arguments for production environment
# Recommended JVM flags for production:
# -Dreactor.netty.ioWorkerCount=16          # Event loop threads (CPU cores × 2)
# -Dreactor.netty.pool.maxConnections=1000  # Large connection pool for production
# -Dreactor.netty.pool.maxIdleTime=120000   # 2 minutes idle timeout (connection reuse)
# -Dreactor.netty.pool.maxLifeTime=600000   # 10 minutes connection lifetime
# -Dreactor.netty.pool.pendingAcquireTimeout=60000   # 1 minute acquire timeout
# -Dreactor.netty.pool.pendingAcquireMaxCount=2000   # Large queue for traffic spikes
# -Dreactor.netty.pool.evictInBackground=120000      # Background cleanup every 2 minutes

# Production environment calculations:
# CPU Cores: 8 (production server)
# Event Loop Threads: 16 (CPU cores × 2, optimal for I/O intensive workloads)
# Max Connections: 1000 (CPU cores × 125, high-capacity for production traffic)
# Worker Threads: 16-32 (auto-detected based on workload)
# 
# Industry standards for Weather Service (I/O intensive API):
# - REST API workload: 80% I/O, 20% CPU
# - Thread multiplier: CPU × 2 for event loops (non-blocking I/O)
# - Connection multiplier: CPU × 100-200 for concurrent users
# - Memory overhead: ~2MB per 100 connections
# 
# Reasoning: Optimized for high-throughput production traffic with proper
# resource management and connection lifecycle handling

spring:
# ==================================================================================
# Production R2DBC Database Configuration
# ==================================================================================    
  r2dbc:
    url: ${DB_URL_PROD:r2dbc:mssql://prod-db-server:1433/weatherdb}
    username: ${DB_USERNAME_PROD:weather_prod_user}
    password: ${DB_PASSWORD_PROD}
    pool:
      enabled: true
      initial-size: 20
      max-size: 100
      max-idle-time: 1h
      max-life-time: 8h
      max-acquire-time: 5s
      max-create-connection-time: 10s
      validation-query: SELECT 1
  sql:
    init:
      mode: never

# ==================================================================================
# Production Logging Configuration
# ==================================================================================
logging:
  level:
    root: WARN
    com.weather: INFO
    org.springframework: WARN
    org.springframework.data.r2dbc: WARN
    io.r2dbc: WARN
    io.github.resilience4j: INFO
    reactor.netty: WARN
    org.springframework.boot.web: INFO
    org.springframework.boot.actuate: INFO
    org.springframework.boot.autoconfigure: WARN
    org.springframework.boot.context.config: WARN
    org.springframework.context: WARN
   

# ==================================================================================
# Production Security Configuration
# ==================================================================================
security:
  allowed-origins:
    - "${ALLOWED_ORIGINS:https://weather-app.yourdomain.com}"
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow-credentials: false
  content-security-policy: "default-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none';"

# ==================================================================================
# Production Resilience Configuration
# ==================================================================================
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 200
        minimum-number-of-calls: 50
        failure-rate-threshold: 30
        wait-duration-in-open-state: 60s
  retry:
    configs:
      default:
        max-attempts: 2
        wait-duration: 1s

# ==================================================================================
# Production Management & Monitoring
# ==================================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
# ==================================================================================
# Production OpenAPI Configuration - Disabled
# ==================================================================================
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
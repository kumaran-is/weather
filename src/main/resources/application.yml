spring:
  application:
    name: weather-service
  main:
    banner-mode: log
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info,metrics,prometheus,deephealth
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    info:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    build:
      enabled: true
    git:
      enabled: true
      mode: full
    java:
      enabled: true
    os:
      enabled: true

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
  override-with-generic-response: false

# Global Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        sliding-window-type: count_based
        minimum-number-of-calls: 5
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        max-wait-duration-in-half-open-state: 5s
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.dao.DataAccessException
          - java.sql.SQLException
          - java.io.IOException
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.dao.DataAccessException
          - java.sql.SQLException
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 1s
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
        cancel-running-future: true

# Logging configuration
logging:
  config: classpath:log4j2.xml
  level:
    com.weather: DEBUG
    org.springframework.r2dbc: INFO
    io.r2dbc.h2: INFO
    org.springframework.security: INFO
    io.github.resilience4j: DEBUG

# Custom application info
info:
  app:
    name: "@project.name@"
    description: "@project.description@"
    version: "@project.version@"
    encoding: "@project.build.sourceEncoding@"
    java:
      version: "@java.version@"

# Weather service specific configuration
weather:
  metrics:
    # Enable custom reactive metrics collection
    enabled: true
    # Include detailed URI and method tags in metrics
    include-detailed-tags: true
    # API path prefixes to include in custom metrics (future-proof for multiple APIs)
    included-api-paths:
      - "/api/v1/"
      # Future extensions:
      # - "/api/auth/"
      # - "/api/v2/"
      # - "/admin/api/"

# Application properties for banner and info
application:
  title: "@project.name@"
  version: "@project.version@"